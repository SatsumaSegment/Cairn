<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="main_styles.css" />
    <link rel="stylesheet" href="workspace_styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cairn</title>
    <script type="module" src="./main.js" defer></script>
    <script type="module" src="./workspace.js" defer></script>
  </head>

  <body>
    <main class="container">

      <div class="view home-view">
        <div class="row">
          <img src="/assets/cairn-mascot.png" class="logo" alt="Cairn logo" />
        </div>

        <h2>Your files. Your machine. Instant answers.</h2>

        <div class="contents">
          <div class="create">
            <button class="create-new-btn">+ Create New Library</button>
          </div>
          <div class="libs">
            <p class="libs-title">Your Libraries</p>
            <div class="libs-list"></div>
          </div>
        </div>

        <!-- Create library modal -->
        <div class="create-modal">
          <h4>Name Your Library</h4>
          <input class="name-lib-input" type="text" placeholder="My Library">
          <div class="modal-btns">
            <button class="cancel-btn">Cancel</button>
            <button class="create-btn">Create</button>
          </div>
        </div>
      </div>


      <div id="workspace-view" class="view workspace-view hidden">

        <aside class="workspace-sidebar" id="sidebar">
          <div class="sidebar-top">
            <button class="back-btn" title="Back to Libraries">←</button>
            <h3 id="active-library-title" class="sidebar-library-name">Library Name</h3>
          </div>

          <div class="file-drop-zone" id="fileDropZone">
            <div class="drop-zone-content">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
              <p>Drag & drop files here</p>
              <span class="sub-text">or click to browse</span>
            </div>
            <div class="uploaded-files-list" id="uploadedFilesList"></div>
          </div>

          <div class="sidebar-bottom">
            <button class="settings-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
              Settings
            </button>
          </div>
        </aside>

        <button class="sidebar-toggle-btn" id="sidebarToggle">☰</button>

        <div class="workspace-main">
          <div class="chat-history" id="chatHistory">
            <div class="chat-message assistant">
              <p>Hello! I'm ready. Ask me anything about the files in this library.</p>
            </div>
          </div>

          <div class="chat-input-container">
            <input type="text" class="chat-input" id="chatInput" placeholder="Ask a question about your files..." />
            <button class="send-btn" id="sendBtn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </div>
        </div>

      </div>



    </main>


  </body>
</html>
